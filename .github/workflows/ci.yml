name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned clang-format
        run: pip install "clang-format==18.1.8"
      - name: Check formatting
        run: |
          files=$(find src tests bench -name '*.cpp' -o -name '*.h')
          clang-format --dry-run --Werror $files

  build-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan-ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan + UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DMESHSLICE_ENABLE_ASAN=ON
          cmake --build build-asan -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  tsan-stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with TSan
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DMESHSLICE_ENABLE_TSAN=ON
          cmake --build build-tsan -j "$(nproc)"
      - name: Concurrency tests under TSan
        run: ctest --test-dir build-tsan --output-on-failure -R "ThreadPool|Determinism|MemoryBudget"

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzzer
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DMESHSLICE_BUILD_FUZZ=ON -DMESHSLICE_BUILD_TESTS=OFF
          cmake --build build-fuzz -j "$(nproc)" --target fuzz_stl
      - name: Run libFuzzer (5k iters)
        run: ./build-fuzz/fuzz_stl -runs=5000 -max_total_time=60

  bench-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build bench
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMESHSLICE_BUILD_TESTS=OFF
          cmake --build build -j "$(nproc)" --target scaling_bench
      - name: Smoke run
        run: ./build/scaling_bench --triangles 50000

  bench-regress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build bench
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMESHSLICE_BUILD_TESTS=OFF
          cmake --build build -j "$(nproc)" --target scaling_bench
      - name: Regression gate vs committed baseline
        run: |
          ./build/scaling_bench --triangles 200000 \
            --regress bench/results/bench_local.json --threshold 0.30

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Build with coverage
        env:
          CC: gcc
          CXX: g++
          CXXFLAGS: "--coverage -O0 -g"
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-cov -j "$(nproc)"
      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure
      - name: Compute coverage
        run: |
          lcov --capture --directory build-cov --output-file cov.info \
            --ignore-errors mismatch,negative,gcov,source 2>/dev/null || \
          lcov --capture --directory build-cov --output-file cov.info
          lcov --extract cov.info "$(pwd)/src/*" --output-file cov.src.info \
            --ignore-errors unused 2>/dev/null
          lcov --list cov.src.info
      - name: Enforce coverage floor
        run: |
          pct=$(lcov --summary cov.src.info 2>&1 | awk '/lines/ {gsub("%","",$2); print $2}')
          echo "src line coverage: ${pct}%"
          floor=80.0
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit (p+0 >= f+0) ? 0 : 1 }' || {
            echo "coverage ${pct}% is below floor ${floor}%"; exit 1;
          }

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: meshslice:ci
